name: ingest-and-build
on:
  schedule: [{ cron: "0 3 * * *" }]  # runs daily ~08:30 IST
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: Install deps
  run: |
    python -m pip install -U pip
    # remove old v1beta client if it is present
    pip uninstall -y google-genai || true
    # install stable client explicitly
    pip install --no-cache-dir google-generativeai==0.7.2 pandas==2.2.2 requests==2.32.3 pdfminer.six==20231228
    # sanity print to confirm which module is loaded
    python - <<'PY'
import google.generativeai as genai, sys
print("GENAI OK", getattr(genai, "__version__", "unknown"), genai.__file__)
PY

      - name: Extract guidance (real mode)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python src/extractor_guidance.py
      - name: Compute metrics
        run: |
          python src/compute_metrics.py
      - name: Commit data
        run: |
          git config user.name "gh-actions"
          git config user.email "actions@users.noreply.github.com"
          git add data/*.csv || true
          git commit -m "Auto-update data $(date -u +'%Y-%m-%dT%H:%M:%SZ')" || echo "No changes"
          git push
      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dashboard
  deploy:
    needs: run
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
