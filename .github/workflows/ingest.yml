name: ingest-and-build
on:
  schedule: [{ cron: "0 3 * * *" }]  # runs daily ~08:30 IST
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: Install deps
        run: |
          python -m pip install -U pip
          pip install pandas requests pdfminer.six google-generativeai
      - name: Extract guidance (real mode)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python src/extractor_guidance.py
      - name: Compute metrics
        run: |
          python src/compute_metrics.py
      - name: Commit data
        run: |
          git config user.name "gh-actions"
          git config user.email "actions@users.noreply.github.com"
          git add data/*.csv || true
          git commit -m "Auto-update data $(date -u +'%Y-%m-%dT%H:%M:%SZ')" || echo "No changes"
          git push
      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dashboard
  deploy:
    needs: run
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
