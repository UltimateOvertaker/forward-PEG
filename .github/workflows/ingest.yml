name: ingest-and-build
on:
  schedule: [{ cron: "0 3 * * *" }]  # daily ~08:30 IST
  workflow_dispatch:                 # <-- enables the "Run workflow" button

jobs:
  run:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }

      # Install deps (force the correct Gemini client)
      - name: Install deps
        run: |
          python -m pip install -U pip
          pip uninstall -y google-genai || true
          pip install --no-cache-dir google-generativeai==0.7.2 pandas==2.2.2 requests==2.32.3 pdfminer.six==20231228
          python - <<'PY'
import google.generativeai as genai, sys
print("GENAI OK", getattr(genai, "__version__", "unknown"), genai.__file__)
PY

      # (Optional but helpful) show your inputs
      - name: Debug inputs
        run: |
          echo '--- data/seed_sources.csv ---'
          test -f data/seed_sources.csv && sed -n '1,60p' data/seed_sources.csv || echo 'MISSING'
          echo '--- data/pe_snapshots.csv ---'
          test -f data/pe_snapshots.csv && sed -n '1,60p' data/pe_snapshots.csv || echo 'MISSING'

      - name: Extract guidance (real mode)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python src/extractor_guidance.py

      - name: Compute metrics
        run: |
          python src/compute_metrics.py

      # Show outputs so we know what was produced
      - name: Debug outputs
        run: |
          echo '--- data/guidance_facts.csv ---'
          test -f data/guidance_facts.csv && sed -n '1,60p' data/guidance_facts.csv || echo 'MISSING'
          echo '--- data/forward_peg.csv ---'
          test -f data/forward_peg.csv && sed -n '1,60p' data/forward_peg.csv || echo 'MISSING'

      - name: Commit data
        run: |
          git config user.name "gh-actions"
          git config user.email "actions@users.noreply.github.com"
          git add data/*.csv || true
          git commit -m "Auto-update data $(date -u +'%Y-%m-%dT%H:%M:%SZ')" || echo "No changes"
          git push

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dashboard

  deploy:
    needs: run
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
